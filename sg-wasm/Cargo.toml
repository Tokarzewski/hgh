[package]
name = "sg-wasm"
version = "0.1.0"
edition = "2021"
description = "Stained-glass hatch pipeline (image -> tessellate -> quantize -> extrude -> GLB) in Rust/WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.122"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
