<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HGH — Rendering</title>
  <link rel="icon" type="image/svg+xml" href="../assets/hopper.svg" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a20;
      --line: #2a2a33;
      --text: #e8e8ec;
      --muted: #9a9aa6;
      --accent: #70846a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 2rem 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    .viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background:
        repeating-conic-gradient(#16161b 0% 25%, #1d1d24 0% 50%) 50% / 22px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .viewer canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Status overlay (loading / error) */
    .status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .status.hidden {
      opacity: 0;
    }

    .status strong {
      color: var(--text);
      font-size: 1.05rem;
    }

    .status.error strong {
      color: #d77;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Backend tag (WebGPU / WebGL2) */
    .backend-tag {
      position: absolute;
      bottom: 0.6rem;
      right: 0.7rem;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(15, 15, 18, 0.7);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .backend-tag.show {
      opacity: 1;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .btn {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--bg);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.55rem 1.25rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #82966f;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 2rem;
      }

      .viewer {
        aspect-ratio: 16 / 9;
      }
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--line);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>

  <!-- ESM-via-CDN: three WebGPU build (self-contained) + Speckle objectloader (deps resolved by esm.sh) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "@speckle/objectloader": "https://esm.sh/@speckle/objectloader@2.28.0"
    }
  }
  </script>
</head>

<body>
  <header>
    <span class="badge">Rendering</span>
    <h1>HGH</h1>
    <p>WebGPU + TSL renderer · live from Speckle</p>
  </header>

  <main>
    <div class="viewer" id="viewer">
      <div class="status" id="status">
        <div class="spinner"></div>
        <strong>Initializing WebGPU…</strong>
        <span id="status-detail">Loading Three.js</span>
      </div>
      <div class="backend-tag" id="backend-tag"></div>
    </div>

    <div class="toolbar">
      <button class="btn" id="download-btn" disabled>Download .glb</button>
    </div>
  </main>

  <footer>
    <a href="../index.html">← Back to asset board</a> · HGH staging page, subject to change
  </footer>

  <script type="module">
    import * as THREE from 'three/webgpu';
    import {
      color, float, mix,
      normalWorld, positionWorld, cameraPosition
    } from 'three/tsl';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import ObjectLoader from '@speckle/objectloader';

    // ── Speckle source ──────────────────────────────────────────────────────
    // Public project — no token needed. We resolve the LATEST version's root
    // object at runtime so the page always shows the newest push.
    const SPECKLE_SERVER = 'https://app.speckle.systems';
    const PROJECT_ID = '566e6518c0';
    const MODEL_ID = 'df97a50075';
    // Fallback root object (latest known) if the GraphQL lookup fails.
    const FALLBACK_OBJECT_ID = '64a2e33e9abd62ab363d573cdc894ff3';

    // ── DOM helpers ───────────────────────────────────────────────────────────
    const viewer = document.getElementById('viewer');
    const statusEl = document.getElementById('status');
    const statusDetail = document.getElementById('status-detail');
    const backendTag = document.getElementById('backend-tag');
    const downloadBtn = document.getElementById('download-btn');

    function setStatus(title, detail) {
      statusEl.classList.remove('hidden', 'error');
      statusEl.querySelector('strong').textContent = title;
      statusDetail.textContent = detail || '';
    }
    function hideStatus() {
      statusEl.classList.add('hidden');
    }
    function setError(title, detail) {
      statusEl.classList.remove('hidden');
      statusEl.classList.add('error');
      statusEl.querySelector('.spinner').style.display = 'none';
      statusEl.querySelector('strong').textContent = title;
      statusDetail.textContent = detail || '';
    }

    let camera, scene, renderer, controls;
    let modelGroup = null;        // the loaded geometry, for export
    let modelName = 'hgh-model';  // used as the download filename

    async function main() {
      // ── Renderer (WebGPU, automatic WebGL2 fallback) ───────────────────────
      renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      sizeRendererToViewer();
      viewer.appendChild(renderer.domElement);
      await renderer.init();

      const backend = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2 (fallback)';
      backendTag.textContent = backend;
      backendTag.classList.add('show');

      // ── Scene + camera ─────────────────────────────────────────────────────
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f0f12);

      camera = new THREE.PerspectiveCamera(50, viewerAspect(), 0.1, 10000);
      camera.position.set(10, 8, 10);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.6;

      setupLights();

      window.addEventListener('resize', onResize);
      downloadBtn.addEventListener('click', downloadGLB);
      renderer.setAnimationLoop(animate);

      // ── Load the model ─────────────────────────────────────────────────────
      try {
        await loadSpeckleModel();
      } catch (err) {
        console.error(err);
        setError('Could not load model', String(err?.message || err));
      }
    }

    function setupLights() {
      scene.add(new THREE.HemisphereLight(0xbfc4cc, 0x14141a, 1.0));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(1, 2, 1.5);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xaab0c0, 0.6);
      fill.position.set(-1.5, 0.5, -1);
      scene.add(fill);
      scene.add(new THREE.AmbientLight(0xffffff, 0.15));
    }

    // ── Custom TSL material: height gradient + sage fresnel rim (on-brand) ────
    function createModelMaterial() {
      const mat = new THREE.MeshStandardNodeMaterial();
      mat.side = THREE.DoubleSide; // IFC mesh winding is inconsistent

      const up = normalWorld.y.mul(0.5).add(0.5);        // 0 = down-facing, 1 = up-facing
      const low = color(0x44444c);
      const high = color(0xc2c2cc);
      mat.colorNode = mix(low, high, up.pow(1.5));
      mat.roughnessNode = float(0.62);
      mat.metalnessNode = float(0.0);

      // Fresnel rim in the brand accent green
      const viewDir = cameraPosition.sub(positionWorld).normalize();
      const fresnel = float(1.0).sub(normalWorld.dot(viewDir).saturate()).pow(3.0);
      mat.emissiveNode = color(0x70846a).mul(fresnel).mul(0.7);

      return mat;
    }

    async function loadSpeckleModel() {
      setStatus('Loading model…', 'Resolving latest version');
      const objectId = await resolveLatestObjectId();

      const loader = new ObjectLoader({
        serverUrl: SPECKLE_SERVER,
        streamId: PROJECT_ID,
        objectId,
        options: { enableCaching: true, excludeProps: [] }
      });

      setStatus('Loading model…', 'Streaming geometry from Speckle');
      const root = await loader.getAndConstructObject((e) => {
        const pct = e.total ? Math.round((e.current / e.total) * 100) : 0;
        setStatus('Loading model…', `${e.stage}: ${pct}%`);
      });

      setStatus('Building geometry…', '');
      const meshes = [];
      collectMeshes(root, meshes, new Set());
      if (meshes.length === 0) throw new Error('No mesh geometry found in this model.');

      const material = createModelMaterial();
      const group = new THREE.Group();
      let triCount = 0;
      for (const m of meshes) {
        const geom = speckleMeshToGeometry(m);
        triCount += (geom.getIndex()?.count || 0) / 3;
        group.add(new THREE.Mesh(geom, material));
      }

      // Speckle/Rhino is Z-up; Three.js is Y-up.
      group.rotation.x = -Math.PI / 2;
      scene.add(group);
      modelGroup = group;
      downloadBtn.disabled = false;

      frameObject(group);
      hideStatus();
      console.log(`Loaded ${meshes.length} meshes, ~${Math.round(triCount)} triangles`);
    }

    // Resolve the newest version's root object via Speckle GraphQL.
    async function resolveLatestObjectId() {
      try {
        const query = `query($p:String!,$m:String!){ project(id:$p){ model(id:$m){ name versions(limit:1){ items{ referencedObject } } } } }`;
        const res = await fetch(`${SPECKLE_SERVER}/graphql`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables: { p: PROJECT_ID, m: MODEL_ID } })
        });
        const json = await res.json();
        const model = json?.data?.project?.model;
        if (model?.name) modelName = model.name.replace(/[^\w.-]+/g, '_');
        return model?.versions?.items?.[0]?.referencedObject || FALLBACK_OBJECT_ID;
      } catch {
        return FALLBACK_OBJECT_ID;
      }
    }

    // Recursively gather every Speckle Mesh in the constructed object tree.
    function collectMeshes(node, out, seen) {
      if (!node || typeof node !== 'object') return;
      if (seen.has(node)) return;
      seen.add(node);

      if (Array.isArray(node)) {
        for (const item of node) collectMeshes(item, out, seen);
        return;
      }

      const t = node.speckle_type;
      if (typeof t === 'string' && t.toLowerCase().includes('mesh') &&
          Array.isArray(node.vertices) && Array.isArray(node.faces)) {
        out.push(node);
      }

      for (const key in node) {
        if (key === 'speckle_type') continue;
        collectMeshes(node[key], out, seen);
      }
    }

    // Convert a Speckle Mesh (flat vertices + encoded faces) to BufferGeometry.
    function speckleMeshToGeometry(mesh) {
      const verts = mesh.vertices;
      const faces = mesh.faces;
      const positions = new Float32Array(verts);

      const indices = [];
      let i = 0;
      while (i < faces.length) {
        let n = faces[i++];
        if (n < 3) n += 3; // legacy encoding: 0 → triangle, 1 → quad
        if (i + n > faces.length) break;
        // Fan-triangulate the polygon.
        for (let k = 1; k < n - 1; k++) {
          indices.push(faces[i], faces[i + k], faces[i + k + 1]);
        }
        i += n;
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setIndex(indices); // auto-selects Uint16/Uint32
      geom.computeVertexNormals();
      return geom;
    }

    // Frame the camera + orbit target around the loaded geometry.
    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;

      const fov = camera.fov * (Math.PI / 180);
      let dist = (maxDim / 2) / Math.tan(fov / 2);
      dist *= 1.7; // padding

      const dir = new THREE.Vector3(1, 0.7, 1).normalize();
      camera.position.copy(center).add(dir.multiplyScalar(dist));
      camera.near = Math.max(dist / 1000, 0.01);
      camera.far = dist * 1000;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    // ── Export the loaded geometry as a binary glTF (.glb) ────────────────────
    async function downloadGLB() {
      if (!modelGroup) return;
      const original = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Exporting…';
      try {
        // Export a clean copy with a plain material (TSL node materials don't
        // serialize to glTF). Geometry is shared — the live scene is untouched.
        const exportGroup = new THREE.Group();
        exportGroup.rotation.copy(modelGroup.rotation);
        const exportMat = new THREE.MeshStandardMaterial({
          color: 0x9a9aa6, roughness: 0.7, metalness: 0.0, side: THREE.DoubleSide
        });
        modelGroup.traverse((o) => {
          if (o.isMesh) exportGroup.add(new THREE.Mesh(o.geometry, exportMat));
        });

        const exporter = new GLTFExporter();
        const glb = await exporter.parseAsync(exportGroup, { binary: true });
        const blob = new Blob([glb], { type: 'model/gltf-binary' });
        triggerDownload(blob, `${modelName}.glb`);
      } catch (err) {
        console.error(err);
        setError('Export failed', String(err?.message || err));
      } finally {
        downloadBtn.textContent = original;
        downloadBtn.disabled = false;
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ── Sizing ────────────────────────────────────────────────────────────────
    function viewerAspect() {
      const r = viewer.getBoundingClientRect();
      return r.width / r.height;
    }
    function sizeRendererToViewer() {
      const r = viewer.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
    }
    function onResize() {
      sizeRendererToViewer();
      camera.aspect = viewerAspect();
      camera.updateProjectionMatrix();
    }

    function animate() {
      controls.update();
      renderer.render(scene, camera);
    }

    main().catch((err) => {
      console.error(err);
      setError('Renderer failed to start', String(err?.message || err));
    });
  </script>
</body>

</html>
