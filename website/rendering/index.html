<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stained Glass — Renderer</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg" />
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a20;
      --line: #2a2a33;
      --text: #e8e8ec;
      --muted: #9a9aa6;
      --accent: #70846a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #161616;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Light top bar (shared design language; tokens kept dark for the viewer) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.25rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e4e4e0;
    }
    .brand { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #161616; }
    .brand img { width: 30px; height: 30px; display: block; }
    .brand .brand-name { font-family: "Abril Fatface", Georgia, serif; font-size: 1.15rem; letter-spacing: 0.04em; }
    .topbar nav { display: flex; align-items: center; gap: 1.4rem; }
    .topbar nav a {
      text-decoration: none; color: #6f6f6f; font-size: 0.82rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .topbar nav a:hover { color: #161616; }
    .lang {
      display: inline-flex; align-items: center; gap: 0.4rem; background: none; border: 0;
      font-family: inherit; font-size: 0.82rem; color: #6f6f6f; cursor: pointer; letter-spacing: 0.04em;
    }
    .lang:hover { color: #161616; }
    .lang svg { width: 16px; height: 16px; }
    .lang .lang-current { font-weight: 700; color: #161616; }

    main {
      max-width: 100%;
      margin: 0 auto;
      padding: 1rem 1.25rem 1.25rem;
    }

    .viewer {
      position: relative;
      width: 90vw;
      height: 90vh;
      margin: 0 auto;
      background:
        repeating-conic-gradient(#16161b 0% 25%, #1d1d24 0% 50%) 50% / 22px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .viewer canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Status overlay (loading / error) */
    .status {
      position: absolute;
      inset: 0;
      z-index: 8; /* above the WebGPU canvas (appended later) and the controls */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .status.hidden {
      opacity: 0;
    }

    .status strong {
      color: var(--text);
      font-size: 1.05rem;
    }

    .status.error strong {
      color: #d77;
    }

    .loading-gif {
      width: 92px;
      height: auto;
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Backend tag (WebGPU / WebGL2) */
    .backend-tag {
      position: absolute;
      bottom: 0.6rem;
      right: 0.7rem;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(15, 15, 18, 0.7);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .backend-tag.show {
      opacity: 1;
    }

    /* Sun controls overlay */
    .controls {
      position: absolute;
      top: 0.7rem;
      left: 0.7rem;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 175px;
      padding: 0.75rem 0.85rem;
      background: rgba(15, 15, 18, 0.72);
      border: 1px solid var(--line);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .controls label {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .controls input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .controls .row {
      flex-direction: row;
      align-items: center;
      gap: 0.45rem;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      cursor: pointer;
    }

    .controls .row input {
      accent-color: var(--accent);
    }

    .toolbar {
      display: flex;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .btn {
      display: inline-block;
      font-family: "Lato", sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      background: #0e0e10;
      border: 1px solid #0e0e10;
      border-radius: 999px;
      padding: 0.7rem 1.6rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #25252a;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 2rem;
      }
    }

    /* ── Mobile: bigger scene, compact controls that don't bury it ──────────── */
    @media (max-width: 640px) {
      main { padding: 0.5rem 0.5rem 1rem; }
      .viewer { width: 100%; height: 74vh; border-radius: 10px; }
      /* controls become a compact 2-column bar across the top, not a tall stack */
      .controls {
        top: 0.45rem; left: 0.45rem; right: 0.45rem;
        min-width: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem 0.8rem;
        padding: 0.6rem 0.7rem;
        font-size: 0.62rem;
      }
      .controls .row { grid-column: 1 / -1; } /* Animate spans the full width */
      .toolbar { margin-top: 0.8rem; }
      .btn { padding: 0.8rem 1.8rem; } /* easier tap target */

      /* Header: keep it on one line so the language toggle isn't clipped */
      .topbar { padding: 0.6rem 0.7rem; gap: 0.6rem; }
      .brand img { width: 24px; height: 24px; }
      .brand .brand-name { font-size: 0.9rem; white-space: nowrap; }
      .topbar nav { gap: 0.75rem; }
      .topbar nav a { font-size: 0.7rem; letter-spacing: 0.03em; }
    }

    footer.site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      color: #6f6f6f;
      font-size: 0.85rem;
      padding: 1.4rem 1.25rem;
      border-top: 1px solid #e4e4e0;
    }
    footer.site-footer .credit { display: inline-flex; align-items: center; gap: 0.7rem; }
    footer.site-footer .credit img { height: 26px; width: auto; opacity: 0.8; display: block; }
  </style>

</head>

  <main>

  <script src="../assets/site.js" defer></script>

  <script type="module">
    import * as THREE from 'three/webgpu';
    import {
      color, float, mix,
      normalWorld, positionWorld, cameraPosition
    } from 'three/tsl';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import initWasm, { compute_palette, render_glb } from '/vendor/sg-wasm/sg_wasm.js';

    // ── Model source: the stained-glass design from the configurator ──────────
    // The configurator stores the chosen design in sessionStorage('sg-design');
    // we rebuild the 3D GLB here with the Rust/WASM pipeline. No Speckle, no network.
    const PANEL_MAJOR = 300;                                  // longer panel dim (model units)
    const DEFAULT_IMG = '../assets/image%20library/peacock.jpg';
    const GLASS_DEPTH = 4.0, FRAME_HEIGHT = 8.0, GLASS_ALPHA = 0.55;

    // ── DOM helpers ───────────────────────────────────────────────────────────
    const viewer = document.getElementById('viewer');
    const statusEl = document.getElementById('status');
    const statusDetail = document.getElementById('status-detail');
    const backendTag = document.getElementById('backend-tag');
    const downloadBtn = document.getElementById('download-btn');
    const controlsPanel = document.getElementById('controls');
    const sunAzEl = document.getElementById('sun-az');
    const sunElEl = document.getElementById('sun-el');
    const sunDistEl = document.getElementById('sun-dist');
    const lightIntensityEl = document.getElementById('light-intensity');
    const sunAnimateEl = document.getElementById('sun-animate');
    const glassTransEl = document.getElementById('glass-trans');

    function setStatus(title, detail) {
      statusEl.classList.remove('hidden', 'error');
      statusEl.querySelector('strong').textContent = title;
      statusDetail.textContent = detail || '';
    }
    function hideStatus() {
      statusEl.classList.add('hidden');
    }
    function setError(title, detail) {
      statusEl.classList.remove('hidden');
      statusEl.classList.add('error');
      const g = statusEl.querySelector('.loading-gif');
      if (g) g.style.display = 'none';
      statusEl.querySelector('strong').textContent = title;
      statusDetail.textContent = detail || '';
    }

    let camera, scene, renderer, controls;
    let modelGroup = null;        // the loaded geometry, for export
    let modelName = 'hgh-model';  // used as the download filename

    // One-time render of the glass panel into a texture, used as a coloured
    // spotlight cookie so the window casts coloured light onto the floor.
    let glassCapture = null; // { cam, rt }
    const GLASS_LAYER = 2;

    // The "sun" (a cookie spotlight) and its rig, repositionable at runtime.
    let theSun = null, theSunMesh = null;
    let sunCenter = null, sunRadius = 0;
    // Kept so the cone / cookie fov / shadow frustum can be recomputed when the
    // Sun-distance slider changes the orbit radius.
    let sunBaseDist = 0, sunPanelHalfDiag = 0, sunFloorSize = 0;
    const BASE_SUN = 7.0;           // spotlight intensity at the slider's default
    let lightIntensity = 1;         // user multiplier from the Light-intensity slider

    // Glass display materials, so transparency (opacity + transmitted light) is adjustable live.
    let glassMats = [];
    let transparency = 1 - GLASS_ALPHA;   // matches the render-view slider default

    // Floor + wall, kept so they can be baked into the glTF export.
    let stageFloor = null, stageWall = null;

    let placeholder = null; // reserved (animation mixer hook); unused with WASM models
    let clock = null;

    async function main() {
      // Load the WASM pipeline in parallel with renderer init.
      const wasmPromise = initWasm();

      // ── Renderer (WebGPU, automatic WebGL2 fallback) ───────────────────────
      renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      sizeRendererToViewer();
      viewer.appendChild(renderer.domElement);
      await renderer.init();

      const backend = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2 (fallback)';
      backendTag.textContent = backend;
      backendTag.classList.add('show');

      // ── Scene + camera ─────────────────────────────────────────────────────
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f0f12);

      camera = new THREE.PerspectiveCamera(50, viewerAspect(), 0.1, 10000);
      camera.position.set(10, 8, 10);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.6;

      setupLights();
      clock = new THREE.Clock();

      window.addEventListener('resize', onResize);
      downloadBtn.addEventListener('click', downloadGLB);
      wireSunControls();
      renderer.setAnimationLoop(animate);

      // ── Build the stained-glass model from the configurator's design ───────
      try {
        await wasmPromise;
        await loadFromConfigurator();
      } catch (err) {
        console.error(err);
        setError('Could not build model', String(err?.message || err));
      }
    }

    // Decode an image URL to RGBA pixels (browser-native).
    function imageToRGBA(src) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => {
          const c = document.createElement('canvas');
          c.width = im.naturalWidth; c.height = im.naturalHeight;
          const cx = c.getContext('2d', { willReadFrequently: true });
          cx.drawImage(im, 0, 0);
          const d = cx.getImageData(0, 0, c.width, c.height);
          resolve({ data: new Uint8Array(d.data.buffer), w: c.width, h: c.height });
        };
        im.onerror = () => reject(new Error('image load failed: ' + src));
        im.src = src;
      });
    }

    // Read the configurator design (or sensible defaults), rebuild the GLB, show it.
    async function loadFromConfigurator() {
      setStatus('Building model…', 'Generating stained glass');
      let design = {};
      try { design = JSON.parse(sessionStorage.getItem('sg-design') || '{}'); } catch {}

      const pattern = design.pattern || 'diamond';
      const tile = design.tile || 16;
      const frame = design.frame ?? 1.2;
      const alpha = design.alpha ?? GLASS_ALPHA;
      const img = await imageToRGBA(design.img || DEFAULT_IMG);

      // panel dims follow the image aspect (matches the configurator)
      const ar = img.w / img.h;
      const panelW = ar >= 1 ? PANEL_MAJOR : PANEL_MAJOR * ar;
      const panelH = ar >= 1 ? PANEL_MAJOR / ar : PANEL_MAJOR;

      // palette: use the configurator's (incl. overrides), else compute one
      let palette = design.palette && design.palette.length
        ? Uint8Array.from(design.palette)
        : compute_palette(img.data, img.w, img.h, 4, 8, 42);

      const glb = render_glb(img.data, img.w, img.h, 4, pattern,
        panelW, panelH, tile, frame, GLASS_DEPTH, FRAME_HEIGHT, alpha, palette);

      const gltf = await new GLTFLoader().parseAsync(glb.buffer, '');
      buildModelFromGLB(gltf.scene);
    }

    // Bake a loaded GLB scene into the staged WebGPU environment with backlit glass.
    function buildModelFromGLB(gltfScene) {
      setStatus('Building geometry…', '');
      gltfScene.updateMatrixWorld(true);
      const group = new THREE.Group();
      let triCount = 0;
      glassMats = [];
      gltfScene.traverse((o) => {
        if (!o.isMesh) return;
        const geom = o.geometry.clone();
        geom.applyMatrix4(o.matrixWorld);   // bake node transform into vertices
        triCount += (geom.getIndex()?.count || geom.attributes.position.count) / 3;
        const src = o.material;
        const hex = src.color ? src.color.getHex(THREE.SRGBColorSpace) : 0xcccccc;
        const opacity = (src.transparent && src.opacity != null) ? src.opacity : 1.0;
        const disp = makeDisplayMaterial(hex, opacity, src.roughness ?? 0.4, src.metalness ?? 0.0);
        if (opacity < 1) glassMats.push(disp);   // translucent glass -> adjustable live
        const mesh = new THREE.Mesh(geom, disp);
        // plain material kept for glTF export (TSL node materials don't serialize)
        mesh.userData.exportMat = new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHex(hex, THREE.SRGBColorSpace),
          roughness: src.roughness ?? 0.4, metalness: src.metalness ?? 0.0,
          side: THREE.DoubleSide, transparent: opacity < 1, opacity
        });
        group.add(mesh);
      });
      if (!group.children.length) throw new Error('Generated model has no geometry.');
      modelGroup = group;

      // Set the glass into a wall with a hole, standing on a floor.
      const stage = buildEnvironment(group);
      scene.add(stage);
      applyTransparency(transparency);          // glass opacity + transmitted-light intensity
      if (glassCapture) captureGlassPanel();    // cookie reflects current glass

      downloadBtn.disabled = false;
      controlsPanel.removeAttribute('hidden');
      frameStage(stage);
      hideStatus();
      console.log(`Built ${group.children.length} meshes, ~${Math.round(triCount)} triangles`);
    }

    // Dim ambient/fill only — the shadow-casting "sun" (added in buildEnvironment)
    // is the key light, so the cast shadows stay dark and legible.
    function setupLights() {
      scene.add(new THREE.HemisphereLight(0xbfc4cc, 0x14141a, 0.12));
      const fill = new THREE.DirectionalLight(0xaab0c0, 0.1);
      fill.position.set(0, 1, 2); // faint front fill so the wall isn't pure black
      scene.add(fill);
      scene.add(new THREE.AmbientLight(0xffffff, 0.04));
    }

    // Glass colour + a subtle same-hue fresnel rim for a backlit stained-glass read.
    function makeDisplayMaterial(hex, opacity, roughness, metalness) {
      const mat = new THREE.MeshStandardNodeMaterial();
      mat.side = THREE.DoubleSide; // mesh winding from CAD is inconsistent

      const base = color(hex);
      const viewDir = cameraPosition.sub(positionWorld).normalize();
      const fresnel = float(1.0).sub(normalWorld.dot(viewDir).saturate()).pow(3.0);
      mat.colorNode = base;
      // Glow in the glass's own colour (+ brighter rim) so it reads as backlit stained glass.
      mat.emissiveNode = base.mul(0.5).add(base.mul(fresnel).mul(0.6));
      mat.roughnessNode = float(roughness);
      mat.metalnessNode = float(metalness);
      if (opacity < 1) { mat.transparent = true; mat.opacity = opacity; }
      return mat;
    }

    // Build the scene around the loaded glass: reorient it to stand upright,
    // set it into a hole in a wall, and stand the wall on a floor.
    function buildEnvironment(model) {
      const stage = new THREE.Group();

      // Measure the raw model and recentre it at the origin.
      let box = new THREE.Box3().setFromObject(model);
      const size0 = box.getSize(new THREE.Vector3());
      const center0 = box.getCenter(new THREE.Vector3());
      model.position.sub(center0);

      // Tag the glass meshes onto a dedicated layer so we can render just the
      // panel into the spotlight-cookie texture (keeps layer 0 for normal view).
      model.traverse((o) => { if (o.isMesh) o.layers.enable(GLASS_LAYER); });

      // Rotate so the thinnest axis (the glass normal) faces +Z (toward camera).
      const pivot = new THREE.Group();
      pivot.add(model);
      const thin = [['x', size0.x], ['y', size0.y], ['z', size0.z]]
        .sort((a, b) => a[1] - b[1])[0][0];
      if (thin === 'x') pivot.rotation.y = Math.PI / 2;
      else if (thin === 'y') pivot.rotation.x = Math.PI / 2;
      stage.add(pivot);
      stage.updateMatrixWorld(true);

      // Re-measure after reorientation; size.z is now the glass thickness.
      box = new THREE.Box3().setFromObject(pivot);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const width = size.x, height = size.y, depth = size.z;
      const sill = height * 0.3;

      // Sit the glass on a sill above the floor, centred on x/z.
      pivot.position.x -= center.x;
      pivot.position.z -= center.z;
      pivot.position.y += sill - box.min.y;
      const glassCenterY = sill + height / 2;

      // ── Floor ───────────────────────────────────────────────────────────────
      const floorMat = new THREE.MeshStandardNodeMaterial();
      floorMat.colorNode = color(0x111114);
      floorMat.roughnessNode = float(0.92);
      floorMat.metalnessNode = float(0.0);
      const floorSize = Math.max(width, height) * 8;
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(floorSize, floorSize), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      stage.add(floor);
      stageFloor = floor;

      // ── Wall with a rectangular hole the size of the glass ────────────────────
      const sideMargin = width * 1.3, topMargin = height * 0.3;
      const wallW = width + 2 * sideMargin;
      const wallH = sill + height + topMargin;
      const wallThk = Math.max(depth * 1.6, width * 0.05);
      const holeW = width * 1.02, holeH = height * 1.02; // slight overlap so glass tucks in

      const shape = new THREE.Shape();
      shape.moveTo(-wallW / 2, 0);
      shape.lineTo(wallW / 2, 0);
      shape.lineTo(wallW / 2, wallH);
      shape.lineTo(-wallW / 2, wallH);
      shape.lineTo(-wallW / 2, 0);
      const hole = new THREE.Path();
      hole.moveTo(-holeW / 2, glassCenterY - holeH / 2);
      hole.lineTo(holeW / 2, glassCenterY - holeH / 2);
      hole.lineTo(holeW / 2, glassCenterY + holeH / 2);
      hole.lineTo(-holeW / 2, glassCenterY + holeH / 2);
      hole.lineTo(-holeW / 2, glassCenterY - holeH / 2);
      shape.holes.push(hole);

      const wallMat = new THREE.MeshStandardNodeMaterial();
      wallMat.colorNode = color(0x3a3a40);
      wallMat.roughnessNode = float(0.85);
      wallMat.metalnessNode = float(0.0);
      wallMat.side = THREE.DoubleSide;
      const wall = new THREE.Mesh(
        new THREE.ExtrudeGeometry(shape, { depth: wallThk, bevelEnabled: false }), wallMat);
      wall.position.z = -wallThk / 2; // straddle the glass plane at z = 0
      wall.castShadow = true;
      wall.receiveShadow = true;
      stage.add(wall);
      stageWall = wall;

      // ── Backlight: a warm glow plane behind the opening + a back light ────────
      const glowMat = new THREE.MeshBasicNodeMaterial();
      glowMat.colorNode = color(0xfff1d4);
      const glow = new THREE.Mesh(
        new THREE.PlaneGeometry(holeW * 1.15, holeH * 1.15), glowMat);
      glow.position.set(0, glassCenterY, -wallThk - depth);
      stage.add(glow);

      const back = new THREE.DirectionalLight(0xfff1d4, 2.0);
      back.position.set(0, glassCenterY, -wallThk - depth * 4);
      back.target.position.set(0, glassCenterY, 0);
      stage.add(back, back.target);

      // ── Sun as a SpotLight whose cookie is the stained-glass panel ──────────
      // Placed behind the wall and aimed at the front floor. The cookie (a render
      // of just the glass) tints the light; everywhere outside the panel the cookie
      // is transparent, so the cone only emits where glass actually is.
      //
      // For the projection to be geometrically correct, the cookie must be captured
      // FROM THE SUN'S viewpoint and projected back along the SAME axis: the spotlight
      // aims through the opening centre, and the capture camera sits at the sun looking
      // at the same centre with a fov equal to the cone. Both follow the sun in
      // updateSun(), which re-renders the cookie. (A fixed head-on capture would skew
      // the cells across the floor as soon as the sun moved off-axis.)
      //
      // The sun orbits far back so its rays read as near-parallel sunlight; the cone
      // angle shrinks to match, keeping the cookie/floor projection panel-sized. The
      // Sun-distance slider scales sunBaseDist; setSunDistance() recomputes the cone,
      // cookie fov and shadow frustum from the resulting radius.
      sunBaseDist = wallThk + depth + width * 2.2 + height * 1.2; // one "distance unit"
      sunPanelHalfDiag = Math.hypot(width / 2, height / 2);
      sunFloorSize = floorSize;

      const glassRT = new THREE.RenderTarget(1024, 1024, { depthBuffer: true, samples: 4 });
      glassRT.texture.colorSpace = THREE.SRGBColorSpace;
      // Perspective capture matching the spotlight cone; fov/near/far + pose set by
      // setSunDistance()/updateSun(). Transparent margins mean the cone only emits
      // where glass is.
      const capCam = new THREE.PerspectiveCamera(30, 1, 1, 10);
      capCam.layers.set(GLASS_LAYER);
      glassCapture = { cam: capCam, rt: glassRT };

      const sun = new THREE.SpotLight(0xffffff, 7.0);
      sun.penumbra = 0.22;
      sun.decay = 0;       // no distance falloff — easier to tune at scene scale
      sun.distance = 0;
      sun.map = glassRT.texture;   // the cookie: only applied because castShadow = true
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0004;
      sun.shadow.focus = 1;
      stage.add(sun, sun.target);

      // Visible sun disc up in the sky behind the wall, along the spotlight axis.
      const sunMat = new THREE.MeshBasicNodeMaterial();
      sunMat.colorNode = color(0xfff2cc);
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(Math.max(width, height) * 0.12, 24, 16), sunMat);
      stage.add(sunMesh);

      // Rig for runtime repositioning: the sun orbits a sphere centred on the
      // window opening; updateSun(az, el) places it (and the disc) on that sphere.
      theSun = sun;
      theSunMesh = sunMesh;
      sunCenter = new THREE.Vector3(0, glassCenterY, 0);
      setSunDistance(+sunDistEl.value); // sets sunRadius, cone, frusta, then positions + captures

      stage.updateMatrixWorld(true);
      return stage;
    }

    // Set how far the sun orbits the opening (factor × sunBaseDist). Closer → wider
    // cone, farther → narrower; the cone, cookie fov and shadow frustum are all
    // recomputed from the new radius so the projection stays panel-sized and correct.
    function setSunDistance(factor) {
      if (!theSun) return;
      sunRadius = sunBaseDist * factor;
      // Bound the panel + margin; clamp so a very close light can't push the spotlight
      // angle past π/2 or the capture fov past 180° (both would be degenerate).
      const coneAngle = Math.min(Math.atan(sunPanelHalfDiag / sunRadius) * 1.15, 1.4);
      theSun.angle = coneAngle;
      const cam = glassCapture.cam;
      cam.fov = 2 * coneAngle * 180 / Math.PI;
      cam.near = sunRadius * 0.5;
      cam.far = sunRadius * 1.5;
      cam.updateProjectionMatrix();
      theSun.shadow.camera.near = sunRadius * 0.5;
      theSun.shadow.camera.far = sunRadius * 1.6 + sunFloorSize;
      theSun.shadow.camera.updateProjectionMatrix();
      updateSunFromUI(); // reposition sun + capture camera at the new radius, re-render cookie
    }

    // Place the sun on a sphere around the window opening from azimuth/elevation
    // (radians). The spotlight aims THROUGH the opening centre, and the cookie
    // capture camera is moved to the sun looking at the same centre, then the cookie
    // is re-rendered — so the coloured cells project correctly for any sun angle.
    function updateSun(az, el) {
      if (!theSun) return;
      const ce = Math.cos(el), se = Math.sin(el);
      const dir = new THREE.Vector3(Math.sin(az) * ce, se, -Math.cos(az) * ce); // behind wall (−z)
      theSun.position.copy(sunCenter).addScaledVector(dir, sunRadius);
      theSun.target.position.copy(sunCenter); // cone axis = sun → opening → floor beyond
      theSun.target.updateMatrixWorld();
      theSunMesh.position.copy(sunCenter).addScaledVector(dir, sunRadius * 1.2);
      // Capture the glass from the sun's viewpoint along the same axis.
      if (glassCapture) {
        const cam = glassCapture.cam;
        cam.position.copy(theSun.position);
        cam.up.set(0, 1, 0);
        cam.lookAt(sunCenter);
        captureGlassPanel();
      }
    }

    function updateSunFromUI() {
      updateSun(THREE.MathUtils.degToRad(+sunAzEl.value), THREE.MathUtils.degToRad(+sunElEl.value));
    }

    // Live glass transparency: t in [0,1]. More transparent -> glass surface more see-through
    // AND more light transmits, so the coloured light cast on the floor gets brighter.
    function applyTransparency(t) {
      transparency = THREE.MathUtils.clamp(t, 0, 1);
      const opacity = THREE.MathUtils.clamp(1 - transparency, 0.08, 1);
      for (const m of glassMats) {
        m.opacity = opacity;
        m.transparent = true;
        m.needsUpdate = true;
      }
      updateSunIntensity();
    }

    // Spotlight brightness = user multiplier × transmitted-light factor (from transparency).
    function updateSunIntensity() {
      if (theSun) theSun.intensity = BASE_SUN * lightIntensity * (0.45 + 1.5 * transparency);
    }

    function wireSunControls() {
      sunAzEl.addEventListener('input', updateSunFromUI);
      sunElEl.addEventListener('input', updateSunFromUI);
      sunDistEl.addEventListener('input', () => setSunDistance(+sunDistEl.value));
      lightIntensityEl.addEventListener('input', (e) => { lightIntensity = +e.target.value; updateSunIntensity(); });
      glassTransEl.addEventListener('input', (e) => applyTransparency(+e.target.value));
      // While animating, the az/el sliders are driven by the loop; disable manual drag.
      sunAnimateEl.addEventListener('change', () => {
        sunAzEl.disabled = sunElEl.disabled = sunAnimateEl.checked;
      });
    }

    // Render only the glass panel (GLASS_LAYER) into the cookie texture, on a
    // transparent background so the lead lines / gaps carry no light.
    function captureGlassPanel() {
      const { cam, rt } = glassCapture;
      const prevBg = scene.background;
      const prevRT = renderer.getRenderTarget();
      scene.background = null;
      renderer.setClearColor(0x000000, 0);
      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(scene, cam);
      renderer.setRenderTarget(prevRT);
      renderer.setClearColor(0x000000, 1);
      scene.background = prevBg;
    }

    // Frame a slightly raised 3/4 view of the glass panel that also shows the floor
    // and the coloured light cast in front of it (rather than a tight front-on crop).
    function frameStage(stage) {
      controls.autoRotate = false;
      scene.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(modelGroup || stage);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y);

      const fov = camera.fov * (Math.PI / 180);
      const dist = (maxDim / 2) / Math.tan(fov / 2) * 2.3; // pull back so floor + cast show

      // raised and slightly off-axis, tilted down toward the floor projection
      camera.position.set(center.x + maxDim * 0.15, center.y + maxDim * 0.55, center.z + dist);
      camera.near = Math.max(dist / 1000, 0.01);
      camera.far = dist * 1000 + 100000; // keep the far floor / light disc in view
      camera.updateProjectionMatrix();

      controls.target.set(center.x, center.y - maxDim * 0.2, center.z + maxDim * 0.5);
      controls.update();
    }

    // Frame the camera + orbit target around the loaded geometry.
    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;

      const fov = camera.fov * (Math.PI / 180);
      let dist = (maxDim / 2) / Math.tan(fov / 2);
      dist *= 1.7; // padding

      const dir = new THREE.Vector3(1, 0.7, 1).normalize();
      camera.position.copy(center).add(dir.multiplyScalar(dist));
      camera.near = Math.max(dist / 1000, 0.01);
      camera.far = dist * 1000;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    // Bake a live (node-material) mesh into the export group as a clone with a
    // plain, glTF-serializable material and its full world transform.
    function bakeMesh(exportGroup, src, mat, name) {
      if (!src) return;
      src.updateWorldMatrix(true, false);
      const m = new THREE.Mesh(src.geometry, mat); // geometry shared, not mutated
      src.matrixWorld.decompose(m.position, m.quaternion, m.scale);
      m.name = name;
      exportGroup.add(m);
    }

    // Add an animated "Sun" node to the export group and return an AnimationClip
    // that orbits it along the same azimuth/elevation sweep used at runtime.
    function buildSunExport(exportGroup) {
      if (!sunCenter) return null;

      const modelSize = new THREE.Box3().setFromObject(modelGroup).getSize(new THREE.Vector3());
      const discR = Math.max(modelSize.x, modelSize.y, modelSize.z) * 0.12 || sunRadius * 0.05;

      const sunGroup = new THREE.Group();
      sunGroup.name = 'SunRig';
      const discMat = new THREE.MeshStandardMaterial({
        color: 0xfff2cc, emissive: 0xfff2cc, emissiveIntensity: 1.0, roughness: 1.0
      });
      sunGroup.add(new THREE.Mesh(new THREE.SphereGeometry(discR, 24, 16), discMat));
      const sunPL = new THREE.PointLight(0xfff4e0, 5.0, 0, 0); // exported via KHR_lights_punctual
      sunGroup.add(sunPL);
      exportGroup.add(sunGroup);

      // Sample one seamless loop of the sweep into position keyframes.
      const D = 12, N = 64;                  // 12-second loop, 64 samples
      const times = [], values = [];
      const sunOf = (az, el) => {
        const ce = Math.cos(el), se = Math.sin(el);
        const dir = new THREE.Vector3(Math.sin(az) * ce, se, -Math.cos(az) * ce);
        return sunCenter.clone().addScaledVector(dir, sunRadius * 1.2);
      };
      for (let i = 0; i <= N; i++) {
        const u = i / N;
        const az = Math.sin(2 * Math.PI * u) * (Math.PI / 3);            // ±60°
        const el = THREE.MathUtils.degToRad(46 + Math.sin(2 * Math.PI * 2 * u) * 26);
        const p = sunOf(az, el);
        times.push(u * D);
        values.push(p.x, p.y, p.z);
      }
      sunGroup.position.fromArray(values, 0); // place at first keyframe

      const track = new THREE.VectorKeyframeTrack('SunRig.position', times, values);
      return new THREE.AnimationClip('SunSweep', D, [track]);
    }

    // ── Export the loaded geometry as a binary glTF (.glb) ────────────────────
    async function downloadGLB() {
      if (!modelGroup) return;
      const original = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Exporting…';
      try {
        // Export a clean copy with plain materials (TSL node materials don't
        // serialize to glTF) — reuse the per-Speckle-material export materials
        // so colours survive. Geometry is shared; the live scene is untouched.
        // Bake each mesh's full WORLD transform (reorientation pivot + centering
        // + sill lift from buildEnvironment) so the .glb matches what's on screen.
        scene.updateMatrixWorld(true);
        const exportGroup = new THREE.Group();
        const fallbackExport = new THREE.MeshStandardMaterial({
          color: 0x9a9aa6, roughness: 0.7, metalness: 0.0, side: THREE.DoubleSide
        });
        modelGroup.traverse((o) => {
          if (!o.isMesh) return;
          const mat = o.userData.exportMat || fallbackExport;
          const m = new THREE.Mesh(o.geometry, mat); // geometry shared, not mutated
          o.matrixWorld.decompose(m.position, m.quaternion, m.scale);
          exportGroup.add(m);
        });

        // Bake the wall + floor (plain materials — their TSL node materials
        // don't serialize) so the .glb is the full staged composition.
        bakeMesh(exportGroup, stageFloor, new THREE.MeshStandardMaterial({
          color: 0x111114, roughness: 0.92, metalness: 0.0
        }), 'Floor');
        bakeMesh(exportGroup, stageWall, new THREE.MeshStandardMaterial({
          color: 0x3a3a40, roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide
        }), 'Wall');

        // Bake the sun sweep into a glTF animation: an animated "Sun" node
        // (glowing disc + punctual light) keyframed along the same orbit the
        // live scene uses. (The coloured-light *projection* is a runtime
        // spotlight cookie and has no glTF equivalent, so it isn't exported.)
        const clip = buildSunExport(exportGroup);

        const exporter = new GLTFExporter();
        const glb = await exporter.parseAsync(exportGroup, {
          binary: true,
          animations: clip ? [clip] : []
        });
        const blob = new Blob([glb], { type: 'model/gltf-binary' });
        triggerDownload(blob, `${modelName}.glb`);
      } catch (err) {
        console.error(err);
        setError('Export failed', String(err?.message || err));
      } finally {
        downloadBtn.textContent = original;
        downloadBtn.disabled = false;
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ── Sizing ────────────────────────────────────────────────────────────────
    function viewerAspect() {
      const r = viewer.getBoundingClientRect();
      return r.width / r.height;
    }
    function sizeRendererToViewer() {
      const r = viewer.getBoundingClientRect();
      renderer.setSize(r.width, r.height, false);
    }
    function onResize() {
      sizeRendererToViewer();
      camera.aspect = viewerAspect();
      camera.updateProjectionMatrix();
    }

    function animate() {
      const dt = clock ? clock.getDelta() : 0;
      if (placeholder?.mixer) placeholder.mixer.update(dt);
      if (theSun && sunAnimateEl.checked) {
        const t = performance.now() * 0.00012;
        const az = Math.sin(t) * (Math.PI / 3);                 // sweep ±60°
        const el = THREE.MathUtils.degToRad(46 + Math.sin(t * 0.6) * 26); // 20°–72°
        sunAzEl.value = THREE.MathUtils.radToDeg(az).toFixed(0);
        sunElEl.value = THREE.MathUtils.radToDeg(el).toFixed(0);
        updateSun(az, el);
      }
      controls.update();
      renderer.render(scene, camera);
    }

    main().catch((err) => {
      console.error(err);
      setError('Renderer failed to start', String(err?.message || err));
    });
  </script>
</body>

</html>
