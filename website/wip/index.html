<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HGH — Work In Progress</title>
  <link rel="icon" type="image/svg+xml" href="../assets/hopper.svg" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a20;
      --line: #2a2a33;
      --text: #e8e8ec;
      --muted: #9a9aa6;
      --accent: #70846a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 2rem 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    .grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 {
        font-size: 2rem;
      }
    }

    @media (min-width: 960px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .media {
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        repeating-conic-gradient(#16161b 0% 25%, #1d1d24 0% 50%) 50% / 22px 22px;
      padding: 0.75rem;
    }

    .media img,
    .media object {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .meta {
      padding: 0.9rem 1rem 1.1rem;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .meta h2 {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }

    .meta .type {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: #23232b;
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--line);
    }
  </style>
</head>

<body>
  <header>
    <span class="badge">Work in Progress</span>
    <h1>HGH</h1>
    <p>Hackathon Grasshopper</p>
  </header>

  <main>
    <section class="grid">

      <article class="card">
        <div class="media">
          <img src="../assets/temat3.png" alt="temat3.png" loading="lazy" />
        </div>
        <div class="meta">
          <h2>temat3.png</h2>
          <span class="type">PNG · raster</span>
        </div>
      </article>

      <article class="card">
        <div class="media">
          <img src="../assets/test_image.jpg" alt="test_image.jpg" loading="lazy" />
        </div>
        <div class="meta">
          <h2>test_image.jpg</h2>
          <span class="type">JPG · raster</span>
        </div>
      </article>

      <article class="card">
        <div class="media">
          <object type="image/svg+xml" data="../assets/hopper.svg" aria-label="hopper.svg">
            <img src="../assets/hopper.svg" alt="hopper.svg" />
          </object>
        </div>
        <div class="meta">
          <h2>hopper.svg</h2>
          <span class="type">SVG · vector mosaic</span>
        </div>
      </article>

    </section>
  </main>

  <footer>
    HGH · SH · ER · BT · MH · MT — staging page, subject to change
  </footer>
</body>

</html>
