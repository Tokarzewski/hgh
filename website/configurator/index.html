<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HGH — Configurator</title>
  <link rel="icon" type="image/svg+xml" href="../assets/hopper.svg" />
  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a20;
      --line: #2a2a33;
      --text: #e8e8ec;
      --muted: #9a9aa6;
      --accent: #70846a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 2rem 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    .viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background:
        repeating-conic-gradient(#16161b 0% 25%, #1d1d24 0% 50%) 50% / 22px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .viewer iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
    }

    .placeholder strong {
      color: var(--text);
      font-size: 1.05rem;
    }

    .placeholder code {
      background: #23232b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      color: var(--text);
    }

    @media (min-width: 640px) {
      h1 {
        font-size: 2rem;
      }

      .viewer {
        aspect-ratio: 16 / 9;
      }
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 2rem 1rem;
      border-top: 1px solid var(--line);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <span class="badge">Configurator</span>
    <h1>HGH</h1>
    <p>Speckle model viewer</p>
  </header>

  <main>
    <div class="viewer" id="viewer">
      <!-- Speckle iframe is injected here by the script below -->
      <div class="placeholder" id="placeholder">
        <strong>No Speckle model configured yet</strong>
        <span>Set <code>PROJECT_ID</code> and <code>MODEL_ID</code> in the page script.</span>
        <span>Get them in Speckle: open your model → <em>Share → Embed</em>.</span>
      </div>
    </div>
  </main>

  <footer>
    <a href="../index.html">← Back to asset board</a> · HGH staging page, subject to change
  </footer>

  <script>
    // ── Speckle embed config ────────────────────────────────────────────────
    // Fill these in from your Speckle model URL:
    //   https://app.speckle.systems/projects/<PROJECT_ID>/models/<MODEL_ID>
    // Or use Share → Embed in the Speckle web app and paste the IDs here.
    const SPECKLE_SERVER = "https://app.speckle.systems";
    const PROJECT_ID = "566e6518c0";
    const MODEL_ID = "df97a50075";

    // Embed options: transparent background, hide controls UI as desired.
    const EMBED_OPTIONS = {
      isEnabled: true,
      isTransparent: true,
      hideControls: false,
      hideSelectionInfo: false,
      noScroll: false
    };

    (function mountSpeckle() {
      if (!PROJECT_ID || !MODEL_ID) return; // keep placeholder visible

      const opts = encodeURIComponent(JSON.stringify(EMBED_OPTIONS));
      const src =
        `${SPECKLE_SERVER}/projects/${PROJECT_ID}/models/${MODEL_ID}#embed=${opts}`;

      const iframe = document.createElement("iframe");
      iframe.src = src;
      iframe.title = "HGH Speckle model";
      iframe.allow = "fullscreen; xr-spatial-tracking";
      iframe.setAttribute("allowfullscreen", "");

      const viewer = document.getElementById("viewer");
      const placeholder = document.getElementById("placeholder");
      if (placeholder) placeholder.remove();
      viewer.appendChild(iframe);
    })();
  </script>
</body>

</html>
